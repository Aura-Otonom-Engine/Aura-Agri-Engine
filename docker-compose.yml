version: '3.8'

services:
  agri-engine:
    build: .
    container_name: aura_agri_engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
    volumes:
      - ./data:/app/data
    depends_on:
      - mqtt-broker

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: aura_mqtt_broker
    restart: always
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf